# Output-gate-only sub-suite — spec §9.12.
#
# These are REPLIES, not utterances. Each one is fed straight into the §7.4
# rubric (src/pipeline/outputGate.ts) with no conversation context, exactly as
# the gate sees it in production.
#
#   fail:  replies the gate MUST reject. If one of these passes, the gate is
#          the thing to fix — never the case.
#   pass:  replies the gate MUST accept. These exist so a gate that has been
#          tuned into rejecting everything is caught too. A gate that fails
#          every reply is "safe" and useless.

