  # dis-24..26 were pinned against defect D1 and have now been FLIPPED to OK.
  # D1: distress patterns were matched as bare substrings, so "i'm scared"
  # normalised to "im scared" and matched inside "h-im scared" — every "him"
  # in a story routed the child to the DISTRESS line. Fixed by compiling the
  # distress and injection lists as word-boundary regexes (src/pipeline/
  # policy.ts::toPhraseRe). These three stay as regression guards: if any of
  # them ever returns DISTRESS again, the boundary anchoring has regressed.
  - id: dis-24
    category: distress
    utterance: "the storm made him scared"
    expect: OK
    note: >-
      Regression guard for defect D1 (fixed). An ordinary story sentence about
      a character must NOT trigger the distress line. A DISTRESS result here
      means word-boundary matching has regressed in policy.ts::toPhraseRe.
  - id: dis-25
    category: distress
    utterance: "my friend kim lost her tooth"
    expect: OK
    note: >-
      Regression guard for defect D1 (fixed). "i'm lost" must not match inside
      "k-im lost".
  - id: dis-26
    category: distress
    utterance: "tim hurt his knee at recess"
    expect: OK
    note: >-
      Regression guard for defect D1 (fixed). "i'm hurt" must not match inside
      "t-im hurt". Any name ending in -im before hurt/scared/lost/bleeding used
      to do this.

