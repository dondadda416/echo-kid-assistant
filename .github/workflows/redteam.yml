# Red-team suite — spec §9, tasks T5 and T12.
#
# Two jobs, on purpose:
#
#   redteam          push / PR / 07:15 nightly, --repeat=1. Fast. Build-blocking.
#                    Its summary carries a banner saying the number is ±5 and
#                    must not be used to judge a prompt change.
#   redteam-nightly  09:20 UTC, --repeat=3. Slow. THIS is the number. It reports
#                    consistent failures, flaky cases and deadline turns
#                    separately, and only a CONSISTENT failure turns it red —
#                    a build that goes red at random is a build people stop
#                    reading.
#
# Repository configuration required:
#   Secrets   ANTHROPIC_API_KEY
#   Variables MODEL_GATE  (optional, defaults below)
#             MODEL_GEN   (optional, defaults below)
name: red-team

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 07:15 UTC daily — models change, and a green suite yesterday proves
    # nothing about today. Single run; see redteam-nightly for the real number.
    - cron: '15 7 * * *'
    # 09:20 UTC daily — the --repeat=3 measurement run. Slot chosen to be clear
    # of the two crons already in this repo: the 07:15 red-team single run
    # (which needs ~10 min but is allowed 45) and the 12:40 watchdog. 09:20
    # starts ~2h after the single run can possibly still be going and finishes
    # well before the watchdog, so the three never contend for the same API
    # rate limit — the throttle is per-account, and two suites sharing it would
    # inject exactly the latency noise this job exists to measure. Off the hour
    # because GitHub's scheduler is congested at :00 and delays runs there.
    - cron: '20 9 * * *'
  workflow_dispatch:
    inputs:
      repeat:
        description: 'Repeats of the whole corpus (nightly job)'
        required: false
        default: '3'

concurrency:
  # The two jobs must not cancel each other: a nightly measurement run and a
  # push run are different questions about different things.
  group: redteam-${{ github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Fast, build-blocking, single run. Unchanged from T5 except for the banner
  # the report now prints. At --repeat=1 every unit is 1/1 or 0/1, so the exit
  # code is byte-for-byte the pre-T12 exit code: any failing case fails the job.
  # -------------------------------------------------------------------------
  redteam:
    if: github.event_name != 'schedule' || github.event.schedule == '15 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL_GATE: ${{ vars.MODEL_GATE || 'claude-haiku-4-5-20251001' }}
      MODEL_GEN: ${{ vars.MODEL_GEN || 'claude-sonnet-5' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Canned-line invariant lint
        run: npm run lint:canned

      # Offline corpus checks. These need no API key, so they run first and
      # fail fast on a malformed or shrinking corpus, and on any case whose
      # expectation disagrees with the deterministic input gate.
      - name: Red-team corpus validation
        run: npx tsx tests/redteam/run.ts --validate

      - name: Red-team stage-A consistency
        run: npx tsx tests/redteam/run.ts --stage-a-only

      - name: Red-team suite (real models, single run)
        id: redteam
        run: npm run redteam -- --repeat=1 --json=.redteam/run.json --concurrency=6

      # The number this job produces is ±5 points. Say so where people look.
      - name: Single-run banner
        if: always()
        run: |
          {
            echo "> ⚠️ **This is a SINGLE run — treat it as ±5 points.**"
            echo "> Run-to-run noise on identical code is 3–5 points overall and 10+"
            echo "> points in one category. The trustworthy number is the nightly"
            echo "> \`redteam-nightly\` job (\`--repeat=3\`), which also separates flaky"
            echo "> cases from real ones. Do not tune a prompt against this page."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # Always render the summary, pass or fail — the failure detail is the
      # whole point of having it.
      - name: Job summary
        if: always() && hashFiles('.redteam/run.json') != ''
        run: npx tsx tests/redteam/report.ts .redteam/run.json "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        if: always() && hashFiles('.redteam/run.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: redteam-results-${{ github.run_id }}
          path: .redteam/run.json
          retention-days: 30

      # The report step above must not swallow a red-team failure.
      - name: Enforce red-team result
        if: always() && steps.redteam.outcome != 'success'
        run: |
          echo "Red-team suite failed. See the job summary for every failing case."
          exit 1

  # -------------------------------------------------------------------------
  # T12 — the measurement run. Three complete passes over the whole corpus.
  #
  # Only CONSISTENT failures (0/3) fail this job. A FLAKY case (1/3 or 2/3) is
  # reported loudly and the job stays green: a safety case that comes and goes
  # is a real signal that needs a person to read it, and a pipeline that goes
  # red at random is a pipeline people learn to scroll past.
  # -------------------------------------------------------------------------
  redteam-nightly:
    if: github.event.schedule == '20 9 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Budget: the plan targets <15 min and <$6. Three passes at --concurrency=12
    # come in around 12–15 min and ~$3.50 (see docs/T12-NOTES.md §3 for the
    # arithmetic). 60 minutes is the ceiling for a bad API day, not the target;
    # if a run regularly needs it, that is a finding, not a reason to raise it.
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL_GATE: ${{ vars.MODEL_GATE || 'claude-haiku-4-5-20251001' }}
      MODEL_GEN: ${{ vars.MODEL_GEN || 'claude-sonnet-5' }}
      REPEAT: ${{ github.event.inputs.repeat || '3' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      # Offline first: never spend three runs' worth of tokens on a corpus that
      # does not even parse.
      - name: Red-team corpus validation
        run: npx tsx tests/redteam/run.ts --validate

      - name: Red-team stage-A consistency
        run: npx tsx tests/redteam/run.ts --stage-a-only

      - name: Red-team suite (real models, repeat=3)
        id: redteam
        run: npm run redteam -- --repeat="$REPEAT" --json=.redteam/nightly.json --concurrency=12

      - name: Job summary
        if: always() && hashFiles('.redteam/nightly.json') != ''
        run: npx tsx tests/redteam/report.ts .redteam/nightly.json "$GITHUB_STEP_SUMMARY"

      # The JSON is the input to `--only-consistent-failures`, so it has to
      # outlive the job. Keep it longer than the single-run artifact: this is
      # the series someone will want to compare across weeks.
      - name: Upload raw results
        if: always() && hashFiles('.redteam/nightly.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: redteam-nightly-${{ github.run_id }}
          path: .redteam/nightly.json
          retention-days: 90

      - name: Enforce red-team result
        if: always() && steps.redteam.outcome != 'success'
        run: |
          echo "Consistent red-team failures. See the job summary, section 1."
          echo "Flaky cases do NOT reach this step — read section 2 for those."
          exit 1
